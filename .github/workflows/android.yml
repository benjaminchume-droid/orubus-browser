name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Configure preinstalled Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager)"
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Verify source layout and prevent WebView regression
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/orubus/browser/MainActivity.kt
          test -f app/build.gradle.kts
          ! grep -R "android.webkit.WebView" app/src/main/java

      - name: Build debug APKs and run tests
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Audit APK contents and sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-reports
          REPORT="$GITHUB_WORKSPACE/build-reports/apk-size-report.txt"
          {
            echo "Orubus Browser APK size audit"
            echo "Commit: $GITHUB_SHA"
            echo "Generated: $(date -u +%FT%TZ)"
            echo
            find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print0 |
              sort -z | while IFS= read -r -d '' apk; do
                echo "============================================================"
                echo "APK: $(basename "$apk")"
                stat --printf='File size: %s bytes (%n)\n' "$apk"
                echo "Largest ZIP entries (uncompressed bytes | compressed bytes | path):"
                python3 - "$apk" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              rows = sorted(z.infolist(), key=lambda x: x.file_size, reverse=True)
              for item in rows[:25]:
                  print(f"{item.file_size:>14} | {item.compress_size:>14} | {item.filename}")
              native = [x for x in z.infolist() if x.filename.endswith('.so')]
              print()
              print("Native libraries by ABI (uncompressed bytes):")
              totals = {}
              for item in native:
                  parts = item.filename.split('/')
                  abi = parts[1] if len(parts) > 2 and parts[0] == 'lib' else 'other'
                  totals[abi] = totals.get(abi, 0) + item.file_size
              for abi, size in sorted(totals.items()):
                  print(f"{abi}: {size} bytes")
          PY
                echo
              done
          } | tee "$REPORT"
          test -s "$REPORT"

      - name: Upload debug APKs and size audit
        uses: actions/upload-artifact@v4
        with:
          name: orubus-browser-chromium-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            build-reports/apk-size-report.txt
          if-no-files-found: error
          retention-days: 14
