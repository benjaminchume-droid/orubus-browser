name: Signed stable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing reviewed tag to release (example: v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: stable-release
    steps:
      - name: Checkout reviewed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Configure preinstalled Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate release signing secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ORUBUS_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ORUBUS_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ORUBUS_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ORUBUS_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Restore signing key outside source tree
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ORUBUS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/orubus-signing"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/orubus-signing/orubus-release.jks"
          chmod 600 "$RUNNER_TEMP/orubus-signing/orubus-release.jks"

      - name: Build signed APK and AAB
        env:
          ORUBUS_KEYSTORE_PATH: ${{ runner.temp }}/orubus-signing/orubus-release.jks
          ORUBUS_KEYSTORE_PASSWORD: ${{ secrets.ORUBUS_KEYSTORE_PASSWORD }}
          ORUBUS_KEY_ALIAS: ${{ secrets.ORUBUS_KEY_ALIAS }}
          ORUBUS_KEY_PASSWORD: ${{ secrets.ORUBUS_KEY_PASSWORD }}
        run: gradle --no-daemon clean test lint assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Generate SHA-256 checksums
        run: |
          cd app/build/outputs
          find apk/release bundle/release -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orubus-browser-stable-${{ inputs.release_tag }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
